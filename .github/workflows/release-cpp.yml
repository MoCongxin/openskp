name: Release C++ Package

on:
  push:
    tags:
      - 'cpp-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify tag matches CMakeLists.txt version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#cpp-v}"
          cmake_version=$(grep -m1 -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' packages/cpp/CMakeLists.txt)
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "Error: tag cpp-v$tag_version does not match packages/cpp/CMakeLists.txt's VERSION $cmake_version."
            exit 1
          fi
          echo "RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Sanity build and test
        run: |
          cmake -S packages/cpp -B build -DOPENSKP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Package source distribution
        run: |
          # Keep test fixtures in the tarball - OPENSKP_BUILD_TESTS defaults ON
          # for a top-level build, so `cmake --build` + `ctest` should work
          # out of the box for anyone who downloads and builds this directly.
          mkdir -p "dist/openskp-cpp-${RELEASE_VERSION}"
          cp -r packages/cpp/. "dist/openskp-cpp-${RELEASE_VERSION}/"
          cd dist
          tar czf "openskp-cpp-${RELEASE_VERSION}.tar.gz" "openskp-cpp-${RELEASE_VERSION}"
          zip -r "openskp-cpp-${RELEASE_VERSION}.zip" "openskp-cpp-${RELEASE_VERSION}" > /dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openskp-cpp-${{ env.RELEASE_VERSION }}.tar.gz
            dist/openskp-cpp-${{ env.RELEASE_VERSION }}.zip
          generate_release_notes: true
